services:
  muse:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "echo '=== RUNNING DB PUSH ===' && npx prisma db push --accept-data-loss && echo '=== DB PUSH DONE, STARTING BOT ===' && node --enable-source-maps dist/scripts/start.js"]
    restart: unless-stopped
    volumes:
      - ./muse:/data
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-muse}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-muse}
      - DEBUG=${DEBUG:-}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - muse-network

  dj-worker:
    # Reuses the exact same image as `muse` -- no separate Dockerfile
    # needed, since refresh-dj-cooccurrence.js and send-stats-digest.js only
    # need @prisma/client + DATABASE_URL (and DISCORD_TOKEN, only for
    # send-stats-digest.js's owner-DM delivery -- no gateway/Client login,
    # just plain REST calls), all already baked into / passed to this image.
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Two independent background loops in one container rather than a
    # second service: cooccurrence refresh every 15min (900s), stats digest
    # check once a day (86400s -- the digest script itself decides per-guild
    # whether that guild's own cadence is actually due). `wait` keeps the
    # container alive as long as either loop is running.
    command: ["sh", "-c", "sleep 60 && (while true; do node dist/scripts/refresh-dj-cooccurrence.js; sleep 900; done) & (while true; do node dist/scripts/send-stats-digest.js; sleep 86400; done) & wait"]
    # The initial `sleep 60` gives `muse` a head start to run its `db push`
    # and create the DJ tables before this service's first query -- belt
    # and suspenders alongside depends_on below, since service_started
    # only means the muse CONTAINER started, not that db push finished
    # inside it.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-muse}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-muse}
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DEBUG=${DEBUG:-}
    depends_on:
      muse:
        condition: service_started
      db:
        condition: service_healthy
    networks:
      - muse-network

  db:
    image: postgres:15-alpine
    container_name: muse-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-muse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-muse}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - muse-network
networks:
  muse-network:
    driver: bridge

volumes:
  postgres_data:
